AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Valeton GP-50 editor backend on ECS/Fargate behind an HTTPS ALB, with an IAM
  task role scoped to Bedrock InvokeModel for the AI patch-generation endpoint.
  WebMIDI needs a secure context, so the ALB terminates TLS (ACM cert required).

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to run the service + ALB in.
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two+ public subnets (different AZs) for the ALB and Fargate tasks.
  CertificateArn:
    Type: String
    Description: ACM certificate ARN for the ALB HTTPS listener (required — WebMIDI needs HTTPS).
  ImageUri:
    Type: String
    Description: Full ECR image URI (e.g. <acct>.dkr.ecr.<region>.amazonaws.com/valeton-ai:latest).
  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Bedrock model / inference-profile id for Haiku 4.5.
  DesiredCount:
    Type: Number
    Default: 1
  AppPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    Description: >
      HTTP Basic Auth password gating the whole app (pages + the Bedrock AI
      endpoint). Required — pick a long, random value. Min 12 chars.
  AppUsername:
    Type: String
    Default: valeton
    Description: HTTP Basic Auth username (paired with AppPassword).

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/valeton-ai
      RetentionInDays: 14

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: valeton-ai

  # --- IAM ---------------------------------------------------------------
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # The app's own role — this is how boto3 reaches Bedrock. Scoped to InvokeModel
  # on the Haiku 4.5 foundation model + inference profile only.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: bedrock-invoke-haiku
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5*
                  - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*claude-haiku-4-5*

  # --- networking --------------------------------------------------------
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: valeton-ai ALB — public HTTPS
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: valeton-ai tasks — only from the ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8756
          ToPort: 8756
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: valeton-ai
      Type: application
      Scheme: internet-facing
      Subnets: !Ref PublicSubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 8756
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      Matcher: { HttpCode: "200" }

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # --- task + service ----------------------------------------------------
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: valeton-ai
      Cpu: "512"
      Memory: "1024"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: web
          Image: !Ref ImageUri
          PortMappings:
            - ContainerPort: 8756
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: BEDROCK_MODEL_ID
              Value: !Ref BedrockModelId
            # HTTP Basic Auth gate over the whole app (protects the Bedrock endpoint).
            # /health is exempt so the ALB target stays healthy.
            - Name: APP_AUTH_USER
              Value: !Ref AppUsername
            - Name: APP_AUTH_PASSWORD
              Value: !Ref AppPassword
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: web

  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref PublicSubnetIds
          SecurityGroups: [!Ref ServiceSecurityGroup]
      LoadBalancers:
        - ContainerName: web
          ContainerPort: 8756
          TargetGroupArn: !Ref TargetGroup

Outputs:
  AlbUrl:
    Description: HTTPS origin — point your DNS/CNAME here (WebMIDI permission is per-origin).
    Value: !Sub https://${LoadBalancer.DNSName}
