AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Valeton GP-50 editor backend on AWS App Runner (reuses the repo Dockerfile
  image from ECR). App Runner provides the HTTPS endpoint and autoscaling with no
  ALB/VPC to manage; the instance role is scoped to Bedrock InvokeModel for the AI
  patch endpoint. WebMIDI's secure-context requirement is met by App Runner's
  built-in *.awsapprunner.com HTTPS URL.

Parameters:
  ImageUri:
    Type: String
    Description: Full ECR image URI incl. tag (e.g. <acct>.dkr.ecr.<region>.amazonaws.com/valeton-ai:latest).
  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Bedrock model / inference-profile id for Haiku 4.5.
  AutoDeploy:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Redeploy automatically when a new image is pushed to the ECR tag.
  AppPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    Description: >
      HTTP Basic Auth password gating the whole app (pages + the Bedrock AI
      endpoint). Required — pick a long, random value. Min 12 chars.
  AppUsername:
    Type: String
    Default: valeton
    Description: HTTP Basic Auth username (paired with AppPassword).

Resources:
  # App Runner pulls the private ECR image with this role.
  EcrAccessRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: build.apprunner.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess

  # The running app assumes this role — how boto3 reaches Bedrock. Scoped to
  # InvokeModel on Haiku 4.5 (foundation model + inference profile) only.
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: tasks.apprunner.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: bedrock-invoke-haiku
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5*
                  - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*claude-haiku-4-5*

  Service:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: valeton-ai
      SourceConfiguration:
        AutoDeploymentsEnabled: !Ref AutoDeploy
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt EcrAccessRole.Arn
        ImageRepository:
          ImageRepositoryType: ECR
          ImageIdentifier: !Ref ImageUri
          ImageConfiguration:
            Port: "8756"
            RuntimeEnvironmentVariables:
              - Name: AWS_REGION
                Value: !Ref AWS::Region
              - Name: BEDROCK_MODEL_ID
                Value: !Ref BedrockModelId
              # no pedal on the server — device I/O runs in the browser (WebMIDI);
              # only /api/device/ai/* and the converter hit this backend
              - Name: DEVICE_IO_MODE
                Value: browser
              # HTTP Basic Auth gate over the whole app (protects the Bedrock endpoint)
              - Name: APP_AUTH_USER
                Value: !Ref AppUsername
              - Name: APP_AUTH_PASSWORD
                Value: !Ref AppPassword
      InstanceConfiguration:
        Cpu: "0.5 vCPU"
        Memory: "1 GB"
        InstanceRoleArn: !GetAtt InstanceRole.Arn
      # TCP health check (port open) — the most robust; the app is confirmed to bind
      # 8756 on boot. (An HTTP /health check was too strict during stabilization.)
      HealthCheckConfiguration:
        Protocol: TCP
        Interval: 10
        Timeout: 5
        HealthyThreshold: 1
        UnhealthyThreshold: 5

Outputs:
  ServiceUrl:
    Description: HTTPS origin for the app (WebMIDI permission is per-origin — pick it once).
    Value: !Sub https://${Service.ServiceUrl}
